<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RAQIB — o'yinlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --txt:#f4f6ff; --mute:#8d96c0; --red:#ff2d46; --blue:#2f7bff; --green:#2ee66b; --yellow:#ffc531; --you:#ff2d46; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--txt); background:#070b1f;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; }
  /* diagonal neon streaks: red bottom-left, blue right */
  body { background:
    linear-gradient(130deg, transparent 0 74%, rgba(47,123,255,.0) 74%, rgba(47,123,255,.55) 75.5%, transparent 77%),
    linear-gradient(130deg, transparent 0 80%, rgba(47,123,255,.35) 81%, transparent 83%),
    linear-gradient(130deg, transparent 0 14%, rgba(255,45,70,.55) 15.5%, transparent 17.5%),
    linear-gradient(130deg, transparent 0 20%, rgba(255,45,70,.3) 21%, transparent 23%),
    radial-gradient(90% 60% at 50% 40%, #121a3d 0%, #0a0f28 60%, #060918 100%); }
  #app { display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom)); gap:10px; }

  #cards { display:flex; gap:10px; }
  .card { --c:var(--green); flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:16px; border:2px solid var(--c); background:rgba(5,10,30,.75);
    box-shadow:0 0 6px var(--c), inset 0 0 10px color-mix(in srgb, var(--c) 25%, transparent);
    opacity:.75; transition:opacity .2s, box-shadow .2s; }
  .card.opp { --c:var(--blue); }
  .card.turn { opacity:1; box-shadow:0 0 16px var(--c), 0 0 2px var(--c), inset 0 0 16px color-mix(in srgb, var(--c) 30%, transparent); }
  .av { width:44px; height:44px; flex:none; border-radius:50%; display:grid; place-items:center;
    border:2px solid var(--c); box-shadow:0 0 10px var(--c); background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 35%, #0b1230), #0b1230); }
  .av svg { width:28px; height:28px; }
  .who { flex:1; min-width:0; }
  .nm { font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fc { display:flex; align-items:center; gap:7px; margin-top:4px; font-weight:800; font-size:16px; }
  .fc i { display:inline-block; width:22px; height:7px; border-radius:4px; background:var(--pc); box-shadow:0 0 6px var(--pc); }
  .fc small { color:var(--mute); font-weight:600; font-size:12px; }
  .clk { display:flex; align-items:center; gap:5px; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; flex:none; }
  .clk svg { width:18px; height:18px; opacity:.85; }
  .clk.low { color:var(--red); }

  #log { display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:20px; min-height:34px;
    border:1px solid rgba(120,140,255,.28); background:rgba(10,16,44,.7); box-shadow:inset 0 0 12px rgba(47,123,255,.12); }
  #log .ic { width:20px; height:20px; flex:none; border-radius:50%; background:var(--blue); color:#fff; font-weight:900;
    font-size:13px; font-family:Georgia,serif; display:grid; place-items:center; box-shadow:0 0 8px var(--blue); }
  #log .tx { flex:1; min-width:0; overflow-x:auto; white-space:nowrap; scrollbar-width:none; font-size:13px; color:#c9d0f0; }
  #log .tx::-webkit-scrollbar { display:none; }
  #log .tx b { font-weight:600; color:#c9d0f0; }
  #log .tx span { margin-right:9px; }

  #banner { display:flex; align-items:center; justify-content:center; gap:10px; min-height:34px; }
  #banner .st { width:44px; height:12px; flex:none;
    background:repeating-linear-gradient(-55deg, var(--yellow) 0 5px, transparent 5px 9px); opacity:.85; }
  #banner .st.r { transform:scaleX(-1); }
  #msg { padding:6px 22px; font-weight:800; font-size:15px; color:var(--yellow); background:rgba(40,30,5,.55);
    border:2px solid var(--yellow); clip-path:polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%);
    text-shadow:0 0 8px rgba(255,197,49,.5); white-space:nowrap; }
  #banner.off { visibility:hidden; }

  #wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { display:block; }

  #tools { display:flex; gap:16px; justify-content:center; }
  .tool { --c:var(--red); display:flex; align-items:center; gap:12px; color:var(--txt); border-radius:16px; padding:12px 20px;
    font-size:16px; font-weight:700; touch-action:none; border:2px solid var(--c); background:rgba(5,10,30,.8);
    box-shadow:0 0 8px var(--c), inset 0 0 10px color-mix(in srgb, var(--c) 25%, transparent); transition:transform .12s, box-shadow .15s; }
  #tV { --c:var(--blue); }
  .tool:active { transform:scale(.96); }
  .tool.sel { background:color-mix(in srgb, var(--c) 22%, #050a1e); box-shadow:0 0 18px var(--c), inset 0 0 16px color-mix(in srgb, var(--c) 45%, transparent); }
  .tool:disabled { opacity:.35; }
  .tool i { display:inline-block; border-radius:4px; background:var(--you); box-shadow:0 0 8px var(--you); }
  #tH i { width:30px; height:8px; } #tV i { width:8px; height:28px; }
  #drag { position:fixed; display:none; pointer-events:none; z-index:6; border-radius:5px; box-shadow:0 0 14px var(--you); }

  .fc, .clk { white-space:nowrap; }
  @media (max-width:420px) {
    /* two rows on phones: avatar + name, then fences + clock */
    .card { display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"av nm nm" "av fc clk";
      align-items:center; column-gap:8px; row-gap:2px; padding:8px 10px; }
    .who { display:contents; } .av { grid-area:av; width:36px; height:36px; } .av svg { width:22px; height:22px; }
    .nm { grid-area:nm; font-size:14px; } .fc { grid-area:fc; margin:0; font-size:14px; } .fc i { width:16px; }
    .clk { grid-area:clk; font-size:16px; } .clk svg { width:14px; height:14px; }
    .tool { padding:11px 16px; font-size:15px; }
  }

  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; z-index:5;
    background:rgba(4,6,18,.7); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #overlay.hide { display:none; }
  .panel { width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
    padding:26px 20px 20px; border-radius:22px; border:2px solid var(--blue); background:rgba(8,13,36,.95);
    box-shadow:0 0 22px rgba(47,123,255,.55), inset 0 0 20px rgba(47,123,255,.15); animation:pop .3s ease-out; }
  @keyframes pop { from { transform:scale(.9); opacity:0; } }
  .logo { display:grid; grid-template-columns:repeat(3,18px); gap:4px; position:relative; margin-bottom:4px; }
  .logo span { width:18px; height:18px; border-radius:5px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); }
  .logo .r, .logo .b { border-radius:50%; border:0; } .logo .r { background:var(--red); box-shadow:0 0 8px var(--red); }
  .logo .b { background:var(--blue); box-shadow:0 0 8px var(--blue); }
  .logo em { position:absolute; left:-2px; top:19px; width:62px; height:5px; border-radius:3px; background:var(--red); box-shadow:0 0 10px var(--red); }
  .panel h1 { margin:0; font-size:28px; font-weight:900; letter-spacing:1px; text-shadow:0 0 14px rgba(47,123,255,.7); }
  .panel p { margin:0; line-height:1.5; color:#c4cbef; font-size:14px; }
  .big { border-radius:16px; padding:14px 20px; font-size:16px; font-weight:800; color:#fff; width:100%;
    background:rgba(5,10,30,.8); border:2px solid var(--blue); box-shadow:0 0 8px var(--blue); transition:transform .12s; }
  .big.pri { border-color:var(--green); box-shadow:0 0 12px var(--green), inset 0 0 12px rgba(46,230,107,.25); }
  .big:active { transform:scale(.97); }

  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:7; }
  .result { gap:12px; }
  .result.win { border-color:var(--yellow); box-shadow:0 0 28px rgba(255,197,49,.5), inset 0 0 22px rgba(255,197,49,.14);
    animation:popWin .6s cubic-bezier(.2,1.6,.4,1); }
  .result.lose { border-color:#7a5cff; box-shadow:0 0 22px rgba(122,92,255,.45), inset 0 0 20px rgba(122,92,255,.14);
    animation:popLose .5s ease-out; }
  @keyframes popWin { from { transform:scale(.6) rotate(-4deg); opacity:0; } }
  @keyframes popLose { from { transform:translateY(30px); opacity:0; } }
  .stage { position:relative; width:150px; height:140px; margin:-8px 0 -4px; }
  .stage canvas { position:absolute; inset:0; width:150px; height:140px; }
  .rays { position:absolute; left:50%; top:50%; width:260px; height:260px; margin:-130px 0 0 -130px; border-radius:50%;
    background:repeating-conic-gradient(rgba(255,197,49,.28) 0 9deg, transparent 9deg 18deg);
    -webkit-mask:radial-gradient(circle, #000 18%, transparent 62%); mask:radial-gradient(circle, #000 18%, transparent 62%);
    animation:spin 14s linear infinite; }
  .lose .rays { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .result h1 { font-size:34px; letter-spacing:2px; }
  .result.win h1 { background:linear-gradient(90deg, #fff6d0 0%, #ffc531 30%, #fff6d0 50%, #ffc531 70%, #fff6d0 100%);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;
    filter:drop-shadow(0 0 10px rgba(255,197,49,.6)); animation:shine 2.2s linear infinite; }
  @keyframes shine { to { background-position:-200% 0; } }
  .result.lose h1 { color:#cfc6ff; text-shadow:0 0 14px rgba(122,92,255,.8); }
  .stats { display:flex; gap:8px; width:100%; }
  .stats div { flex:1; border-radius:12px; padding:8px 4px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); }
  .stats b { display:block; font-size:19px; } .stats small { color:var(--mute); font-size:11px; }

  /* ---------- games hub ---------- */
  #hub { position:fixed; inset:0; z-index:4; overflow-y:auto; touch-action:pan-y; background:inherit;
    padding:18px 14px calc(22px + env(safe-area-inset-bottom)); }
  #hub.hide { display:none; }
  .hub-in { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .hello { display:flex; align-items:center; gap:12px; }
  .hello .av { --c:var(--green); }
  .hello small { display:block; color:var(--mute); font-size:13px; font-weight:600; }
  .hello b { font-size:18px; }
  .hub-title { display:flex; align-items:center; gap:10px; margin:6px 0 0; font-size:26px; font-weight:900; letter-spacing:.5px;
    text-shadow:0 0 14px rgba(47,123,255,.6); }
  .hub-title::after { content:""; flex:1; height:2px; border-radius:2px; background:linear-gradient(90deg, var(--blue), transparent);
    box-shadow:0 0 8px var(--blue); }
  .gcard { --c:var(--blue); display:flex; gap:14px; align-items:center; padding:12px; border-radius:18px; border:2px solid var(--c);
    background:rgba(5,10,30,.8); box-shadow:0 0 10px var(--c), inset 0 0 14px color-mix(in srgb, var(--c) 22%, transparent);
    cursor:pointer; transition:transform .15s; animation:cardIn .4s ease-out backwards; }
  .gcard:nth-child(2) { animation-delay:.07s; } .gcard:nth-child(3) { animation-delay:.14s; } .gcard:nth-child(4) { animation-delay:.21s; }
  @keyframes cardIn { from { transform:translateY(16px); opacity:0; } }
  .gcard:active { transform:scale(.98); }
  .gcard canvas, .gcard .ph { width:92px; height:92px; flex:none; border-radius:14px; background:#0c1230;
    border:1px solid rgba(120,140,255,.25); }
  .gcard .ph { display:grid; place-items:center; font-size:34px; border-style:dashed; background:rgba(255,255,255,.03); }
  .gcard .info { flex:1; min-width:0; }
  .gcard h3 { margin:0 0 4px; font-size:18px; }
  .gcard p { margin:0 0 8px; font-size:13px; color:#c4cbef; line-height:1.35; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chips span { font-size:11px; padding:3px 8px; border-radius:10px; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1); color:#d6dbf5; white-space:nowrap; }
  .rec { margin-top:8px; font-size:12px; color:var(--mute); } .rec b { color:var(--txt); }
  .gcard .play { flex:none; border:2px solid var(--green); color:#fff; background:rgba(46,230,107,.12);
    box-shadow:0 0 10px var(--green); border-radius:14px; padding:10px 14px; font-weight:800; font-size:14px; }
  .gcard.soon { --c:#3a4270; opacity:.6; box-shadow:none; cursor:default; }
  .soon-tag { font-size:11px; font-weight:800; color:var(--yellow); border:1px solid var(--yellow); border-radius:8px;
    padding:2px 7px; margin-left:6px; vertical-align:middle; }
  #exitBtn { flex:none; border:1.5px solid var(--red); background:rgba(255,45,70,.14); color:#fff; font-weight:800; font-size:12.5px;
    padding:5px 11px; border-radius:12px; box-shadow:0 0 8px rgba(255,45,70,.55); white-space:nowrap; }
  #exitBtn:active { transform:scale(.95); }
  .big.danger { border-color:var(--red); box-shadow:0 0 12px var(--red), inset 0 0 12px rgba(255,45,70,.25); }
  #back { flex:none; width:28px; height:28px; padding:0; border-radius:50%; border:1px solid rgba(120,140,255,.4);
    background:rgba(255,255,255,.06); color:#fff; font-size:18px; line-height:1; display:grid; place-items:center; }
  @media (max-width:420px) {
    .gcard { gap:10px; padding:10px; flex-wrap:wrap; } .gcard canvas, .gcard .ph { width:76px; height:76px; }
    .gcard .play { width:100%; }
  }

  /* ---------- rooms lobby ---------- */
  #lobby { position:fixed; inset:0; z-index:4; overflow-y:auto; touch-action:pan-y; background:inherit;
    padding:14px 14px calc(22px + env(safe-area-inset-bottom)); }
  #lobby.hide { display:none; }
  .lob-top { display:flex; align-items:center; gap:10px; }
  .icon-btn { width:38px; height:38px; flex:none; padding:0; border-radius:12px; border:1px solid rgba(120,140,255,.4);
    background:rgba(255,255,255,.06); color:#fff; font-size:22px; display:grid; place-items:center; }
  .lob-title { flex:1; min-width:0; }
  .lob-title b { display:block; font-size:20px; font-weight:900; text-shadow:0 0 12px rgba(47,123,255,.6); }
  .lob-title small { color:var(--mute); font-size:12px; font-weight:600; }
  .create { flex:none; border:2px solid var(--green); background:rgba(46,230,107,.14); color:#fff; font-weight:800; font-size:14px;
    padding:10px 14px; border-radius:14px; box-shadow:0 0 12px var(--green), inset 0 0 10px rgba(46,230,107,.2); }
  .create:active, .act:active, .room button:active, .opt:active { transform:scale(.96); }
  .lob-actions { display:flex; gap:10px; }
  .act { --c:var(--blue); flex:1; border:2px solid var(--c); background:rgba(5,10,30,.8); color:#fff; font-weight:700; font-size:14px;
    padding:12px 8px; border-radius:14px; box-shadow:0 0 8px var(--c), inset 0 0 10px color-mix(in srgb, var(--c) 22%, transparent); }
  #lobBot { --c:var(--red); }
  .sec { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; margin-top:4px; }
  .sec span { font-size:12px; color:var(--mute); font-weight:600; }
  .sec::after { content:""; flex:1; height:1px; background:rgba(120,140,255,.25); }
  #rooms { display:flex; flex-direction:column; gap:10px; }
  .room { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:16px; border:1px solid rgba(120,140,255,.3);
    background:rgba(8,13,36,.85); animation:cardIn .3s ease-out backwards; }
  .room .av { --c:var(--red); width:40px; height:40px; } .room .av svg { width:24px; height:24px; }
  .room .meta { flex:1; min-width:0; }
  .room .meta b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .room .meta small { color:var(--mute); font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);
    margin-right:5px; animation:blink 1.4s infinite; }
  .room button { flex:none; border:2px solid var(--green); background:rgba(46,230,107,.12); color:#fff; font-weight:800; font-size:14px;
    border-radius:12px; padding:8px 14px; box-shadow:0 0 8px var(--green); }
  .empty-rooms { text-align:center; padding:28px 16px; border-radius:18px; border:1px dashed rgba(120,140,255,.3); color:#c4cbef;
    font-size:14px; line-height:1.5; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty-rooms .ic2 { font-size:40px; }
  .opts { display:flex; flex-direction:column; gap:10px; width:100%; }
  .opt { --c:var(--green); display:flex; align-items:center; gap:12px; text-align:left; padding:14px; border-radius:16px; color:#fff;
    border:2px solid var(--c); background:rgba(5,10,30,.8); box-shadow:0 0 10px var(--c), inset 0 0 12px color-mix(in srgb, var(--c) 22%, transparent); }
  .opt.priv { --c:#a77bff; }
  .opt .e { font-size:28px; } .opt b { display:block; font-size:16px; } .opt small { color:#c4cbef; font-size:12.5px; line-height:1.35; }
  .code-in { width:100%; text-align:center; font-size:30px; font-weight:900; letter-spacing:8px; text-transform:uppercase; padding:12px;
    border-radius:14px; border:2px solid var(--blue); background:#070b1f; color:#fff; outline:none; font-family:inherit;
    box-shadow:0 0 10px rgba(47,123,255,.5); user-select:text; -webkit-user-select:text; touch-action:auto; }
  .code-show { font-size:36px; font-weight:900; letter-spacing:10px; padding:8px 12px 8px 22px; border-radius:14px; cursor:pointer;
    border:2px dashed var(--yellow); color:var(--yellow); text-shadow:0 0 10px rgba(255,197,49,.6); }
  .hint { color:var(--mute); font-size:12px; margin-top:-6px; }
  .err { color:#ff8a98; font-size:13px; min-height:16px; margin-top:-4px; }
  .waiting { display:flex; gap:6px; } .waiting i { width:9px; height:9px; border-radius:50%; background:var(--blue);
    box-shadow:0 0 8px var(--blue); animation:bob 1s ease-in-out infinite; }
  .waiting i:nth-child(2) { animation-delay:.15s; } .waiting i:nth-child(3) { animation-delay:.3s; }
  @keyframes bob { 50% { transform:translateY(-8px); opacity:.5; } }
  #toast { position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0; z-index:8;
    padding:10px 16px; border-radius:12px; background:rgba(20,26,60,.96); border:1px solid rgba(120,140,255,.45); font-weight:700;
    font-size:14px; transition:.25s; pointer-events:none; white-space:nowrap; box-shadow:0 0 14px rgba(47,123,255,.4); }
  #toast.on { opacity:1; transform:translate(-50%, 0); }

  .room.playing { opacity:.55; }
  .room .meta b { display:flex; align-items:center; }
  .room .meta b .nmx { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room .meta b .tag { flex:none; }
  .room.pubr .av { --c:var(--green); } .room.privr .av { --c:#a77bff; }
  .room .tag { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:6px; vertical-align:2px; border:1px solid; }
  .tag.pub { color:var(--green); border-color:rgba(46,230,107,.5); } .tag.priv { color:#c9b3ff; border-color:rgba(167,123,255,.6); }
  .room button.priv { border-color:#a77bff; background:rgba(167,123,255,.14); box-shadow:0 0 8px #a77bff; }
  .room button:disabled { border-color:#3a4270; background:transparent; box-shadow:none; color:var(--mute); }
  .room.fresh { animation:fresh .6s ease-out; }
  @keyframes fresh { from { background:rgba(46,230,107,.18); } }

  /* ---------- bottom nav + rating / profile ---------- */
  #hub, .tab { padding-bottom:calc(92px + env(safe-area-inset-bottom)) !important; }
  .tab { position:fixed; inset:0; z-index:4; overflow-y:auto; touch-action:pan-y; background:inherit; padding:18px 14px; }
  .tab.hide { display:none; }
  #nav { position:fixed; left:0; right:0; bottom:0; z-index:4; display:flex; justify-content:center;
    padding:6px 10px calc(8px + env(safe-area-inset-bottom)); background:rgba(6,9,24,.92); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); border-top:1px solid rgba(47,123,255,.45); box-shadow:0 -4px 22px rgba(47,123,255,.18); }
  #nav.hide { display:none; }
  #nav .in { display:flex; width:100%; max-width:560px; }
  #nav button { flex:1; border:0; background:none; color:var(--mute); display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; font-size:11.5px; font-weight:700; position:relative; transition:color .2s; }
  #nav button span { font-size:22px; filter:grayscale(.7) opacity(.7); transition:filter .2s, transform .2s; }
  #nav button.on { color:#fff; }
  #nav button.on span { filter:none; transform:translateY(-2px) scale(1.08); }

  .rm-note { font-size:13.5px; font-weight:800; color:var(--yellow); min-height:0; }

  /* ---------- Telegram fullscreen: keep clear of the status bar and Telegram's Close / ⋯ buttons ---------- */
  :root { --st:calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --sb:var(--tg-safe-area-inset-bottom, 0px); }

  /* ---------- responsive ---------- */
  #app { height:100vh; height:var(--tg-viewport-stable-height, 100dvh); }
  .panel { max-height:calc(100dvh - 32px); overflow-y:auto; }
  /* small phones (iPhone SE, 320-360px) */

    .hub-title { font-size:22px; }
    .gcard h3 { font-size:16px; }
    .act { font-size:12.5px; padding:11px 6px; }
    .ranked b { font-size:15px; }
    .panel { padding:20px 14px 16px; }
    .big { padding:12px 14px; font-size:15px; }

  /* short screens: keep the board as large as possible */

  /* computers and phones held sideways: board on the left, everything else on the right */

    #nav button { padding:3px 0; } #nav button span .i { width:20px; height:20px; }
  }
  /* wide screens: roomier lists */
  @media (min-width:900px) {
    .hub-in { max-width:980px; }
    #games { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); }
    #rooms { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); }
    .pgrid { grid-template-columns:repeat(6, 1fr); }
    #board { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); }
    .gcard:hover, .room:hover, .lrow:hover { transform:translateY(-2px); transition:transform .15s; }
  }
  /* fullscreen safe area (0 outside Telegram fullscreen) — must come last to win over the media queries */
  #app { padding-top:calc(10px + var(--st)) !important; }
  #hub, .tab, #lobby { padding-top:calc(18px + var(--st)) !important; }
  #overlay { padding-top:calc(20px + var(--st)); }
  #nav { padding-bottom:calc(8px + max(var(--sb), env(safe-area-inset-bottom))); }
</style>

<script>
(() => {
  const F = window.FenceRace, { COLS, ROWS } = F;
  document.querySelectorAll('i[data-ic]').forEach(e => { e.outerHTML = ic(e.dataset.ic); });
  const lbl = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    .replace(/\{([a-z]+)\}/g, (_, n) => ic(n));
  const COLORS = ['#ff2d46', '#2f7bff'];
  // which game is open; every rules module has newGame/start/apply/checkTimeout/resign/botAction/CLOCK_MS
  const RULES = { tosiq: F, xo: window.XO, shashka: window.Shashka, shaxmat: window.Chess };
  const GAME_NAMES = { shaxmat: 'Shaxmat', shashka: 'Shashka', tosiq: "To'siq Jangi", xo: 'X va O' };
  const SHORT_NAMES = { shaxmat: 'Shaxmat', shashka: 'Shashka', tosiq: "To'siq", xo: 'X va O' };
  let kind = 'tosiq', viewKind = 'tosiq', xoPlaced = {}, xoEndAt = 0;
  const R = () => RULES[kind];
  const is8 = (k) => k === 'shashka' || k === 'shaxmat'; // the 8x8 board games
  const stepsOf = (g) => (g.n !== undefined ? g.n : g.log.length);
  // lighten (amt > 0) or darken (amt < 0) a #rrggbb colour
  const shade = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16), t = amt < 0 ? 0 : 255, a = Math.abs(amt);
    const ch = (v) => Math.round(v + (t - v) * a);
    return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
  };
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  let popAt = 0;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#070b1f'); tg.setBackgroundColor('#070b1f'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
  // phones: open edge to edge (Bot API 8.0+); Telegram's own buttons then float over the top,
  // so the layout keeps clear of --tg-safe-area-inset-top / --tg-content-safe-area-inset-top
  try {
    if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && ['android', 'ios'].includes(tg.platform) && !tg.isFullscreen) tg.requestFullscreen();
  } catch (e) {}
  const haptic = (k) => { try {
    if (!tg || !tg.HapticFeedback) return;
    if (k === 'success' || k === 'error' || k === 'warning') tg.HapticFeedback.notificationOccurred(k);
    else tg.HapticFeedback.impactOccurred(k);
  } catch (e) {} };
  const $ = (id) => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // ---------- sound: short synthesized effects (Web Audio), can be muted; remembered per device ----------
  const Snd = (() => {
    let ac = null, on = store.get('sound') !== '0';
    const audio = () => {
      if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; try { ac = new A(); } catch (e) { return null; } }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return ac;
    };
    // one note: frequency f (Hz), d seconds long, starting `at` seconds from now, sliding to f2
    function note(a, f, d, o = {}) {
      const t = a.currentTime + (o.at || 0), osc = a.createOscillator(), gn = a.createGain();
      osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(o.vol || 0.14, t + 0.008);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
      osc.connect(gn); gn.connect(a.destination); osc.start(t); osc.stop(t + d + 0.02);
    }
    function noise(a, d, vol, at = 0, freq = 1800) {
      const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      const src = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; gn.gain.value = vol;
      src.connect(f); f.connect(gn); gn.connect(a.destination); src.start(a.currentTime + at);
    }
    const SOUNDS = {
      tap: (a) => note(a, 660, 0.05, { type: 'triangle', vol: 0.06 }),
      move: (a) => { noise(a, 0.07, 0.5, 0, 2400); note(a, 420, 0.06, { type: 'triangle', vol: 0.08 }); },
      capture: (a) => { noise(a, 0.12, 0.9, 0, 1400); note(a, 300, 0.12, { type: 'square', vol: 0.05, to: 160 }); },
      fence: (a) => { note(a, 150, 0.18, { type: 'sine', vol: 0.25, to: 70 }); noise(a, 0.08, 0.5, 0, 700); },
      check: (a) => { note(a, 880, 0.09, { type: 'square', vol: 0.06 }); note(a, 1175, 0.14, { type: 'square', vol: 0.06, at: 0.09 }); },
      crown: (a) => [784, 988, 1319].forEach((f, i) => note(a, f, 0.16, { type: 'triangle', vol: 0.1, at: i * 0.07 })),
      win: (a) => [523, 659, 784, 1047, 1319].forEach((f, i) => note(a, f, i === 4 ? 0.5 : 0.16, { type: 'triangle', vol: 0.13, at: i * 0.11 })),
      lose: (a) => [392, 330, 262, 196].forEach((f, i) => note(a, f, i === 3 ? 0.5 : 0.2, { type: 'sine', vol: 0.13, at: i * 0.16 })),
      draw: (a) => [523, 440, 523].forEach((f, i) => note(a, f, 0.18, { type: 'sine', vol: 0.11, at: i * 0.15 })),
      start: (a) => { note(a, 440, 0.12, { type: 'square', vol: 0.05 }); note(a, 660, 0.12, { type: 'square', vol: 0.05, at: 0.12 }); note(a, 880, 0.25, { type: 'square', vol: 0.05, at: 0.24 }); },
      tick: (a) => note(a, 1200, 0.03, { type: 'square', vol: 0.04 }),
      pop: (a) => note(a, 500, 0.12, { type: 'sine', vol: 0.15, to: 1100 }),
      error: (a) => note(a, 180, 0.15, { type: 'sawtooth', vol: 0.05 }),
      notify: (a) => { note(a, 988, 0.1, { type: 'triangle', vol: 0.1 }); note(a, 1319, 0.2, { type: 'triangle', vol: 0.1, at: 0.1 }); },
    };
    return {
      play(k) { if (!on || !SOUNDS[k]) return; const a = audio(); if (a) try { SOUNDS[k](a); } catch (e) {} },
      get on() { return on; },
      toggle() { on = !on; store.set('sound', on ? '1' : '0'); if (on) this.play('notify'); return on; },
      unlock() { if (on) audio(); },
    };
  })();
  addEventListener('pointerdown', () => Snd.unlock(), { once: true });
  function paintSoundButtons() {
    document.querySelectorAll('.snd').forEach(b => { b.innerHTML = ic(Snd.on ? 'volume' : 'mute'); b.setAttribute('aria-label', Snd.on ? "Ovozni o'chirish" : 'Ovozni yoqish'); });
  }
  document.querySelectorAll('.snd').forEach(b => b.onclick = (e) => {
    e.stopPropagation(); haptic('light'); Snd.toggle(); paintSoundButtons(); toast(Snd.on ? '{volume} Ovoz yoqildi' : "{mute} Ovoz o'chirildi");
  });
  paintSoundButtons();

  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  let uid = user ? 'tg' + user.id : store.get('uid');
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); store.set('uid', uid); }
  const myName = user ? (user.username || user.first_name || "O'yinchi") : 'anon-' + uid.slice(-5);
  // Telegram passes the avatar only for users who allow it; anything else falls back to an icon
  const isPhoto = (u) => typeof u === 'string' && /^https:\/\/t\.me\/i\/userpic\//.test(u);
  const myPhoto = user && isPhoto(user.photo_url) ? user.photo_url : null;
  let photos = [null, null];
  function setAvatar(el, photo, fallback) {
    const key = photo || fallback;
    if (el.dataset.av === key) return;
    el.dataset.av = key;
    if (!isPhoto(photo)) { el.innerHTML = fallback; return; }
    const img = new Image(); img.alt = ''; img.referrerPolicy = 'no-referrer'; img.src = photo;
    img.onerror = () => { el.innerHTML = fallback; };
    el.innerHTML = ''; el.appendChild(img);
  }

  // ---------- state ----------
  let mode = null;          // 'online' | 'bot'
  let game = null, you = 0, names = ['—', '—'], online = [false, false];
  let ws = null, roomId = null, config = { bot: '', app: '' }, clockOffset = 0;
  let tool = null, ghost = null, shownWinner = false;
  // per-pawn animation state (positions in game coordinates)
  const newAnim = (p) => ({ r: p.r, c: p.c, tr: p.r, tc: p.c, segD: 0, dir: 'down', walk: 0, moving: 0, landAt: -1e9, movedAt: -1e9 });
  let anim = [newAnim({ r: 0, c: 0 }), newAnim({ r: 0, c: 0 })];
  let resultHero = null; // animated character on the win/lose panel
  // 8x8 boards: selected square, its legal targets, the last move's slide, and a piece being dragged
  let sel8 = null, targets8 = [], anim8 = null, drag8 = null, dropped8 = false, rematchState = [false, false];
  let round = 0; // bumped whenever a new game starts

  fetch('config.json').then(r => r.json()).then(c => config = c).catch(() => {});

  // player 1 sees the board rotated so their own pawn starts at the bottom
  const flip = () => you === 1;
  const cellView = (r, c) => flip() ? { r: ROWS - 1 - r, c: COLS - 1 - c } : { r, c };
  const fenceView = (f) => !flip() ? { ...f } : f.o === 'h'
    ? { ...f, r: ROWS - f.r, c: COLS - 2 - f.c } : { ...f, r: ROWS - 2 - f.r, c: COLS - f.c };

  const ICON_USER = '<svg viewBox="0 0 24 24" fill="#e8ecff"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z"/></svg>';
  const ICON_BOT = '<svg viewBox="0 0 24 24"><rect x="11.2" y="1.5" width="1.6" height="3" fill="#cfe0ff"/><circle cx="12" cy="1.8" r="1.4" fill="#2f7bff"/>'
    + '<rect x="3.5" y="5" width="17" height="13" rx="5" fill="#e8ecff"/><rect x="5.6" y="7.6" width="12.8" height="7.6" rx="3.4" fill="#16204a"/>'
    + '<circle cx="9.2" cy="11.4" r="1.7" fill="#4fc3ff"/><circle cx="14.8" cy="11.4" r="1.7" fill="#4fc3ff"/>'
    + '<rect x="1.5" y="9" width="2" height="5" rx="1" fill="#9fb6ff"/><rect x="20.5" y="9" width="2" height="5" rx="1" fill="#9fb6ff"/>'
    + '<path d="M7 19h10l-1.5 3h-7z" fill="#cfd8ff"/></svg>';
  const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
    + '<circle cx="12" cy="13.5" r="8"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5v3"/></svg>';

  function flash(text, ms) {
    $('msg').innerHTML = lbl(text);
    $('banner').classList.toggle('off', !text);
    clearTimeout(flash.t);
    if (ms) flash.t = setTimeout(refreshMsg, ms);
  }
  function refreshMsg() {
    if (!game || game.winner !== null) return flash('');
    if (mode === 'online' && !online[1 - you]) return flash('{hourglass} Raqib kutilmoqda...');
    if (game.turn === you && game.chain != null) return flash('{swords} Urishni davom ettiring!');
    if (game.turn === you && game.check) return flash('{alert} Shoh! Shohingizni himoya qiling');
    flash(game.turn === you ? (tool ? "To'siq joyini tanlang" : 'Sizning navbatingiz!') : game.check ? 'Raqibga shoh! Raqib navbati...' : 'Raqib navbati...');
  }

  const myTurn = () => game && game.winner === null && game.turn === you && game.turnStart !== null
    && (mode !== 'online' || online[1 - you]);

  function render() {
    // left card = you, right card = opponent
    [you, 1 - you].forEach((p, k) => {
      const el = $('card' + k);
      el.classList.toggle('turn', game.winner === null && game.turn === p && game.turnStart !== null);
      const nm = names[p] || (mode === 'online' ? 'Kutilmoqda...' : '—');
      const nmEl = el.querySelector('.nm'); nmEl.textContent = nm;
      if (mode === 'online' && names[p] && !online[p]) nmEl.insertAdjacentHTML('beforeend', ' ' + ic('offline'));
      if (p !== you) el.style.setProperty('--c', COLORS[p]);
      el.style.setProperty('--pc', COLORS[p]);
      const isBot = mode === 'bot' && p !== you;
      setAvatar(el.querySelector('.av'), isBot ? null : mode === 'bot' ? myPhoto : photos[p], isBot ? ICON_BOT : ICON_USER);
      el.querySelector('.fc i').style.display = kind === 'tosiq' ? '' : 'none';
      el.querySelector('.fc span').innerHTML = kind === 'xo' ? `<span class="sym">${XO.symbol(game, p)}</span> <small>${p === you ? 'siz' : 'raqib'}</small>`
        : kind === 'shashka' ? `<span class="disc"></span> ${Shashka.count(game, p)} <small>dona</small>`
        : kind === 'shaxmat' ? chessBadge(p)
        : `${game.left[p]} <small>/${F.FENCES}</small>`;
    });
    document.documentElement.style.setProperty('--you', COLORS[you]);
    $('tools').style.display = kind === 'tosiq' ? '' : 'none';
    $('inviteBtn').classList.toggle('hide', !(mode === 'online' && !roomRanked && !online[1 - you] && game.turnStart === null));
    $('reactBtn').classList.toggle('hide', !(mode === 'online' && names[1 - you]));
    // X va O: your own mark waits in the tray below the board
    $('xoTray').classList.toggle('hide', kind !== 'xo');
    if (kind === 'xo') {
      const piece = $('xoPiece'), sym = XO.symbol(game, you);
      if (piece.dataset.sym !== sym) { piece.dataset.sym = sym; piece.innerHTML = xoSvg(sym); }
      piece.classList.toggle('on', myTurn()); piece.classList.toggle('off', !myTurn());
    }
    if (kind === 'tosiq') {
      $('tH').disabled = $('tV').disabled = game.left[you] <= 0;
      if (game.left[you] <= 0 && tool) setTool(null);
    }
    const L = $('log').querySelector('.tx');
    L.innerHTML = '';
    if (!game.log.length) L.textContent = "Hali yurish yo'q";
    for (let i = 0; i < game.log.length; i += 2) {
      const s = document.createElement('span');
      s.textContent = `${i / 2 + 1}. ${game.log[i]}${game.log[i + 1] ? ' ' + game.log[i + 1] : ''}`;
      L.append(s);
    }
    L.scrollLeft = L.scrollWidth;
    refreshMsg();
    if (game.winner !== null && !shownWinner) {
      shownWinner = true;
      const won = game.winner === you, draw = game.winner === -1;
      haptic(won ? 'success' : draw ? 'warning' : 'error');
      setTimeout(() => Snd.play(won ? 'win' : draw ? 'draw' : 'lose'), 350);
      // let the board celebrate / mourn for a moment first
      // (compare rounds, not objects: a later update of the same finished game must not cancel the card)
      const r = round;
      setTimeout(() => { if (round === r && game && game.winner !== null) showResult(won, draw); }, 1500);
    }
  }

  function setState(g) {
    const prev = game;
    game = g;
    const fresh = !prev || (prev.winner !== null && g.winner === null) || g.log.length < prev.log.length;
    if (fresh) { round++; if (g.pawns) anim = g.pawns.map(newAnim); shownWinner = false; resultHero = null; xoPlaced = {}; xoEndAt = 0; }
    if (g.kind === 'xo') { // remember when each mark appeared so it can be drawn in
      g.board.forEach((v, i) => { if (v !== null && !(i in xoPlaced)) xoPlaced[i] = fresh && prev ? 0 : performance.now(); });
      if (g.winner !== null && !xoEndAt) xoEndAt = performance.now();
    }
    if (prev && prev.winner !== null && g.winner === null) hideOverlay();
    const stepped = prev && !fresh && g.last && stepsOf(g) > stepsOf(prev);
    if (stepped) {
      const L = g.last;
      if (L.p !== you) haptic(L.t === 'fence' || L.cap != null ? 'heavy' : 'light');
      Snd.play(L.t === 'fence' ? 'fence' : L.check ? 'check' : L.crowned || L.promo ? 'crown' : L.cap != null ? 'capture' : 'move');
      if (is8(g.kind) && L.from !== undefined && !(L.p === you && dropped8)) anim8 = { from: L.from, to: L.to, at: performance.now() };
    }
    if (fresh && prev && g.winner === null) Snd.play('start');
    dropped8 = false;
    if (is8(g.kind)) { sel8 = null; targets8 = []; if (g.turn === you && g.chain != null && g.winner === null) select8(g.chain); }
    if (g.fences && g.fences.length > (prev && !fresh && prev.fences ? prev.fences.length : g.fences.length)) popAt = performance.now();
    ghost = null;
    render();
    updateRematch();
  }

  // ---------- actions ----------
  function act(a) {
    if (!myTurn()) return flash('Hozir sizning navbatingiz emas', 1200);
    if (mode === 'online') { ws.send(JSON.stringify(a)); ghost = null; return; }
    const g = JSON.parse(JSON.stringify(game));
    const err = R().apply(g, you, a, Date.now());
    if (err) { haptic('warning'); Snd.play('error'); return flash(err, 1500); }
    haptic(a.t === 'fence' ? 'heavy' : 'light');

  $('tH').addEventListener('pointerdown', (e) => startDrag('h', e));

  function startDrag(o, e) {
    if (!game || game.left[you] <= 0) return;

  }
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
    if (!drag.moved) {
      drag.moved = true; setTool(drag.o);
      if (!myTurn()) flash('Hozir sizning navbatingiz emas', 1200);
    }
    // on touch, aim a bit above the finger so the fence stays visible
    const lift = e.pointerType === 'mouse' ? 0 : cell * 0.9;
    const x = e.clientX, y = e.clientY - lift, b = cv.getBoundingClientRect(), el = $('drag');
    const over = x >= b.left - cell / 2 && x <= b.right + cell / 2 && y >= b.top - cell / 2 && y <= b.bottom + cell / 2;
    if (over && myTurn()) {
      el.style.display = 'none';
      const g = fenceAt(drag.o, (x - b.left - offX) / cell, (y - b.top - offY) / cell);
      if (!ghost || ghost.o !== g.o || ghost.r !== g.r || ghost.c !== g.c) {
        const err = F.fenceError(game, g.o, g.r, g.c);
        ghost = { ...g, ok: !err };

        left: (x - w / 2) + 'px', top: (y - h / 2) + 'px' });

  const xoSvg = (sym) => sym === 'X'

  // ---------- online ----------
  function connect() {
    mode = 'online';

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';

    const join = Object.assign({ initData: tg ? tg.initData : '', photo: myPhoto },

    sock.onopen = () => sock.send(searching ? queueMsg() : JSON.stringify(Object.assign({ t: 'join', uid, name: myName }, join)));
    sock.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.t === 'state') {
        you = m.you; names = m.names; online = m.online; clockOffset = m.now - Date.now(); photos = m.photos || [null, null];
        pendingCreate = null; joinCode = null; roomId = m.room; roomPub = m.pub; roomCode = m.code || roomCode; eloInfo = m.elo;
        roomRanked = m.ranked; searching = false; if (m.kind) kind = m.kind;
        const rm = m.rematch || [false, false];
        if (rm[1 - you] && !rematchState[1 - you] && m.game.winner !== null) { Snd.play('notify'); haptic('medium'); toast("{again} Raqib revansh so'rayapti!"); }
        rematchState = rm;
        if (online[0] && online[1] && ['wait', 'vs', 'search'].includes($('overlay').dataset.kind)) hideOverlay();
        setState(m.game);
        if (!(online[0] && online[1]) && m.game.turnStart === null) showWaiting();
      } else if (m.t === 'searching') updateSearch(m);
      else if (m.t === 'matched') { searching = false; showVersus(m); }
      else if (m.t === 'requeue') { searching = true; roomId = null; sock.send(queueMsg()); showSearch(); toast("Raqib chiqib ketdi — qayta qidirilmoqda"); }
      else if (m.t === 'err' && m.code === 'auth') { showLobby(); haptic('warning'); toast('{alert} ' + m.msg); }
      else if (m.t === 'err' && m.code === 'badcode') { const t = lastTarget; showLobby(); haptic('warning'); showJoinCode(t, m.msg); }
      else if (m.t === 'err' && m.code === 'notfound') { showLobby(); haptic('warning'); toast('{alert} ' + m.msg); }
      else if (m.t === 'react') showReaction(m.e, m.from === you);

      else if (m.t === 'full') { showLobby(); haptic('warning'); toast("{alert} Bu xonada allaqachon 2 o'yinchi bor"); }
    };

    };
  }

  function drawResultHero(now) {
    const h = resultHero;
    if (!h || $('overlay').classList.contains('hide')) return;
    const x = h.ctx;
    x.clearRect(0, 0, 150, 140);
    if (!h.won && !h.draw) { // little rain cloud
      x.fillStyle = 'rgba(160,170,210,.85)';
      for (const [cx, cy, r] of [[58, 26, 14], [76, 20, 17], [94, 27, 13], [76, 32, 13]]) { x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); }
      x.strokeStyle = 'rgba(130,190,255,.8)'; x.lineWidth = 2; x.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const d = ((now / 700) + i / 6) % 1, rx = 54 + i * 9;
        x.globalAlpha = 1 - d; x.beginPath(); x.moveTo(rx, 42 + d * 50); x.lineTo(rx - 2, 49 + d * 50); x.stroke();
      }
      x.globalAlpha = 1;
    }
    const hop = h.won ? Math.abs(Math.sin(now / 200)) * 22 : h.draw ? Math.abs(Math.sin(now / 320)) * 6 : 0;
    const sq = h.won ? (hop < 3 ? 0.12 : -0.04) : 0.06;
    Hero.draw(x, 75, 128, 110, { color: h.color, kind: 'human', dir: 'down', pose: h.won ? 'win' : h.draw ? 'idle' : 'lose', blink: now % 3000 < 120,
      t: now, hop, squash: sq, glow: 1 });

  // realtime room list: the server pushes the whole list whenever a room opens, fills, starts or closes
  function openLobbySocket() {
    closeLobbySocket();
    const s = lobbyWs = new WebSocket(wsUrl());
    s.onopen = () => s.send(JSON.stringify({ t: 'lobby', uid }));
    s.onmessage = (ev) => { const m = JSON.parse(ev.data); if (m.t === 'rooms') renderRooms(m); };
    s.onclose = () => {
      if (lobbyWs !== s) return;
      renderRooms(null);

      c.beginPath(); c.moveTo(cx - r, cy - r); c.lineTo(cx - r + 2 * r * a, cy - r + 2 * r * a); c.stroke();
      if (b > 0) { c.beginPath(); c.moveTo(cx + r, cy - r); c.lineTo(cx + r - 2 * r * b, cy - r + 2 * r * b); c.stroke(); }
    } else { c.beginPath(); c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog); c.stroke(); }
    c.restore();
  }
  function paintXO(c, x0, y0, size, g, now, hints, placed = xoPlaced, endAt = xoEndAt) {
    const cs = size / 3, gp = Math.max(5, cs * 0.06), rad = cs * 0.14, pulse = 0.5 + 0.5 * Math.sin(now / 300);
    for (let i = 0; i < 9; i++) {
      const x = x0 + (i % 3) * cs + gp / 2, y = y0 + Math.floor(i / 3) * cs + gp / 2, s = cs - gp;
      const gr = c.createLinearGradient(0, y, 0, y + s); gr.addColorStop(0, '#20263f'); gr.addColorStop(1, '#171c31');
      c.fillStyle = gr; c.beginPath(); c.roundRect ? c.roundRect(x, y, s, s, rad) : c.rect(x, y, s, s); c.fill();
      c.strokeStyle = 'rgba(170,185,255,.16)'; c.lineWidth = 1; c.stroke();
      const v = g.board[i];
      if (v === null && hints && g.winner === null) { c.fillStyle = `rgba(255,255,255,${0.03 + 0.04 * pulse})`; c.fill(); }
      if (g.last && g.last.i === i && g.winner === null) { c.strokeStyle = COLORS[v] + '88'; c.lineWidth = 2; c.stroke(); }
      if (v !== null) {
        const t0 = placed[i] || 0, prog = t0 ? Math.min(1, (now - t0) / 280) : 1;
        xoMark(c, x + s / 2, y + s / 2, s, XO.symbol(g, v), COLORS[v], prog);
      }
    }
    if (g.line) { // glowing strike through the winning three
      const ctr = (k) => [x0 + (k % 3 + 0.5) * cs, y0 + (Math.floor(k / 3) + 0.5) * cs];
      const [ax, ay] = ctr(g.line[0]), [bx, by] = ctr(g.line[2]);
      const ex = (bx - ax) * 0.18, ey = (by - ay) * 0.18, prog = endAt ? Math.min(1, (now - endAt) / 450) : 1;
      const sx = ax - ex, sy = ay - ey, tx = sx + (bx + ex - sx) * prog, ty = sy + (by + ey - sy) * prog;
      c.save(); c.lineCap = 'round';
      c.strokeStyle = COLORS[g.winner]; c.shadowColor = COLORS[g.winner]; c.shadowBlur = 22; c.lineWidth = cs * 0.13;
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(tx, ty); c.stroke();
      c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = cs * 0.04;
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(tx, ty); c.stroke();
      c.restore();
    }
  }
  // hub thumbnail: a short game that loops — X wins on the diagonal
  function drawXoThumb(c, now) {
    const seq = [4, 1, 0, 2, 8], t = now % 4600, n = Math.min(seq.length, Math.floor(t / 500));
    const g = { board: Array(9).fill(null), starter: 0, winner: null, line: null };
    const placed = {};
    seq.slice(0, n).forEach((i, k) => { g.board[i] = k % 2; placed[i] = now - (t - k * 500); });
    if (n === seq.length) { g.winner = 0; g.line = [0, 4, 8]; }
    paintXO(c, 3, 3, 86, g, now, false, placed, now - (t - seq.length * 500));
  }

  // ---------- shashka & shaxmat: 8x8 board ----------
  // the board fills the same square as the 9x9 one; black sees it turned around
  const sq8 = () => cell * COLS / 8;
  const flip8 = () => !!game && is8(game.kind) && (game.kind === 'shashka' ? Shashka : Chess).colorOf(game, you) === 'b';
  const view8 = (i) => (flip8() ? 63 - i : i); // its own inverse
  const ownerOf8 = (g, x) => (x.toLowerCase() === 'w' || (g.kind === 'shaxmat' && x === x.toUpperCase()) ? g.starter : 1 - g.starter);
  // chess pieces as vector shapes in a 100x100 box (base at the bottom)
  const BASE = 'M22 92 L78 92 L78 85 Q78 80 73 80 L27 80 Q22 80 22 85 Z';
  const PIECE_PATHS = {
    p: ['M38 31 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0 Z', 'M40 44 L60 44 L57 50 C61 60 66 70 68 80 L32 80 C34 70 39 60 43 50 Z'],
    r: ['M27 44 L27 20 L37 20 L37 28 L45 28 L45 20 L55 20 L55 28 L63 28 L63 20 L73 20 L73 44 Z', 'M33 44 L67 44 L70 80 L30 80 Z'],
    b: ['M46 11 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 Z', 'M50 16 C63 25 67 37 62 48 L38 48 C33 37 37 25 50 16 Z', 'M38 52 L62 52 C63 63 66 72 68 80 L32 80 C34 72 37 63 38 52 Z'],
    n: ['M31 80 C30 66 38 58 45 50 C38 52 31 56 26 52 C21 48 23 41 29 37 C37 30 41 21 47 13 L50 21 C60 19 70 27 72 42 C74 56 69 68 71 80 Z'],
    q: ['M22 30 L32 66 L68 66 L78 30 L64 48 L60 24 L50 46 L40 24 L36 48 Z', 'M32 68 L68 68 L66 80 L34 80 Z',
      'M18 28 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 Z', 'M35 22 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 Z', 'M55 22 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 Z',
      'M72 28 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 Z'],
    k: ['M46 8 L54 8 L54 16 L61 16 L61 23 L54 23 L54 34 L46 34 L46 23 L39 23 L39 16 L46 16 Z',
      'M50 44 C40 30 24 34 26 48 C27 57 33 62 34 66 L66 66 C67 62 73 57 74 48 C76 34 60 30 50 44 Z', 'M33 68 L67 68 L66 80 L34 80 Z'],
  };
  const DETAIL = { b: 'M55 25 L46 37', n: 'M41 30 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0', k: 'M50 44 L50 64', q: 'M34 66 L66 66', r: 'M33 44 L67 44' };
  let piecePaths = null;
  const pathsFor = (t) => {
    if (!piecePaths) {
      piecePaths = {};
      for (const k in PIECE_PATHS) piecePaths[k] = { body: [BASE].concat(PIECE_PATHS[k]).map(d => new Path2D(d)), detail: DETAIL[k] ? new Path2D(DETAIL[k]) : null };
    }
    return piecePaths[t];
  };
  // glow: the owner's colour (player 0 red, player 1 blue)
  function drawChessPiece(c, x, y, s, piece, glow) {
    const P = pathsFor(piece.toLowerCase()), white = piece === piece.toUpperCase();
    c.save(); c.translate(x - s / 2, y - s / 2); c.scale(s / 100, s / 100);
    c.lineJoin = 'round'; c.lineWidth = 4;
    c.shadowColor = glow; c.shadowBlur = 14;
    c.fillStyle = white ? '#f3f5ff' : '#1d2350';
    for (const p of P.body) c.fill(p);
    c.shadowBlur = 0; c.strokeStyle = white ? '#2a3160' : '#d7ddff';
    for (const p of P.body) c.stroke(p);
    if (P.detail) { c.lineWidth = 3.5; c.stroke(P.detail); if (piece.toLowerCase() === 'n') { c.fillStyle = c.strokeStyle; c.fill(P.detail); } }
    c.restore();
  }
  function drawDisc(c, x, y, s, color, king, alpha) {
    const r = s * 0.38;
    c.save(); c.globalAlpha = alpha == null ? 1 : alpha;
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(x, y + r * 0.22, r, r * 0.95, 0, 0, 7); c.fill();
    c.shadowColor = color; c.shadowBlur = 12;
    const gr = c.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
    gr.addColorStop(0, shade(color, 0.45)); gr.addColorStop(1, shade(color, -0.25));
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = Math.max(1.5, s * 0.035);
    c.beginPath(); c.arc(x, y, r * 0.68, 0, 7); c.stroke();
    if (king) { // a little crown
      const k = r * 0.55;
      c.fillStyle = '#ffd34d'; c.shadowColor = '#ffc531'; c.shadowBlur = 8;
      c.beginPath(); c.moveTo(x - k, y + k * 0.55); c.lineTo(x - k, y - k * 0.35); c.lineTo(x - k * 0.5, y + k * 0.05); c.lineTo(x, y - k * 0.6);
      c.lineTo(x + k * 0.5, y + k * 0.05); c.lineTo(x + k, y - k * 0.35); c.lineTo(x + k, y + k * 0.55); c.closePath(); c.fill();
    }
    c.restore();
  }
  function drawPiece8(c, g, x, y, s, piece, alpha) {
    const color = COLORS[ownerOf8(g, piece)];
    if (g.kind === 'shaxmat') { c.save(); c.globalAlpha = alpha == null ? 1 : alpha; drawChessPiece(c, x, y, s * 0.86, piece, color); c.restore(); }
    else drawDisc(c, x, y, s, color, piece === 'W' || piece === 'B', alpha);
  }

  function select8(i) {
    sel8 = i;
    if (i === null) { targets8 = []; return; }
    targets8 = game.kind === 'shashka'
      ? Shashka.legalSteps(game, you).filter(s => s.from === i).map(s => ({ to: s.to, cap: s.over !== undefined }))
      : Chess.legalMoves(game, Chess.colorOf(game, you)).filter(m => m.from === i && (!m.promo || m.promo === 'q'))
          .map(m => ({ to: m.to, cap: !!game.board[m.to] || !!m.ep, promo: !!m.promo }));
  }
  const mine8 = (i) => { const x = game.board[i]; return !!x && ownerOf8(game, x) === you; };

  function paint8(now) {
    const S = sq8(), g = game, chess = g.kind === 'shaxmat';
    const lastSq = g.last && g.last.from !== undefined ? [g.last.from, g.last.to] : [];
    const kingInCheck = chess && g.check && g.winner === null ? Chess.kingSq(g.board, Chess.colorOf(g, g.turn)) : -1;
    const matedKing = chess && g.reason === 'mate' ? Chess.kingSq(g.board, Chess.colorOf(g, 1 - g.winner)) : -1;
    const pulse = 0.5 + 0.5 * Math.sin(now / 300);
    ctx.save();
    ctx.shadowColor = 'rgba(47,123,255,.55)'; ctx.shadowBlur = 18; ctx.fillStyle = '#0d1230';
    rr(offX - 3, offY - 3, S * 8 + 6, S * 8 + 6, 10); ctx.fill();
    ctx.restore();
    for (let v = 0; v < 64; v++) {
      const i = view8(v), r = Math.floor(v / 8), c = v % 8, x = offX + c * S, y = offY + r * S, dark = (r + c) % 2 === 1;
      ctx.fillStyle = dark ? (chess ? '#27305e' : '#232a52') : (chess ? '#8f9bd0' : '#3b4474');
      ctx.fillRect(x, y, S, S);
      if (lastSq.includes(i)) { ctx.fillStyle = 'rgba(255,197,49,.28)'; ctx.fillRect(x, y, S, S); }
      if (i === sel8) { ctx.fillStyle = hexA(COLORS[you], 0.38); ctx.fillRect(x, y, S, S); }
      if (i === kingInCheck || i === matedKing) {
        const gr = ctx.createRadialGradient(x + S / 2, y + S / 2, 0, x + S / 2, y + S / 2, S * 0.7);
        gr.addColorStop(0, `rgba(255,45,70,${0.65 + 0.3 * pulse})`); gr.addColorStop(1, 'rgba(255,45,70,0)');
        ctx.fillStyle = gr; ctx.fillRect(x, y, S, S);
      }
      // coordinates along the left and bottom edges
      ctx.fillStyle = dark ? 'rgba(200,210,255,.55)' : 'rgba(20,26,60,.6)';
      ctx.font = `700 ${Math.max(8, S * 0.18)}px system-ui,sans-serif`;
      if (c === 0) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(String(8 - Math.floor(i / 8)), x + 2, y + 2); }
      if (r === 7) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('abcdefgh'[i % 8], x + S - 2, y + S - 1); }
    }
    // pieces that can move this turn get a soft hint when nothing is selected (shashka: shows forced captures)
    const movable = new Set();
    if (myTurn() && sel8 === null && g.kind === 'shashka') for (const s of Shashka.legalSteps(g, you)) movable.add(s.from);
    const a = anim8, at = a ? Math.min(1, (now - a.at) / 190) : 1;
    for (let v = 0; v < 64; v++) {
      const i = view8(v), x = g.board[i];
      if (!x || (drag8 && drag8.moved && drag8.i === i)) continue;
      let cx = offX + (v % 8 + 0.5) * S, cy = offY + (Math.floor(v / 8) + 0.5) * S;
      if (a && at < 1 && a.to === i) { // slide in from where it came from
        const fv = view8(a.from), e = 1 - Math.pow(1 - at, 3);
        cx = lerp(offX + (fv % 8 + 0.5) * S, cx, e); cy = lerp(offY + (Math.floor(fv / 8) + 0.5) * S, cy, e);
      }
      if (movable.has(i)) {
        ctx.save(); ctx.strokeStyle = hexA(COLORS[you], 0.5 + 0.4 * pulse); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(cx, cy, S * 0.45, 0, 7); ctx.stroke(); ctx.restore();
      }
      drawPiece8(ctx, g, cx, cy, S, x, g.taken && g.taken.includes(i) ? 0.35 : 1);
    }
    for (const t of targets8) {
      const v = view8(t.to), x = offX + (v % 8 + 0.5) * S, y = offY + (Math.floor(v / 8) + 0.5) * S;
      ctx.save(); ctx.fillStyle = ctx.strokeStyle = hexA(COLORS[you], 0.75); ctx.shadowColor = COLORS[you]; ctx.shadowBlur = 8;
      if (t.cap && g.board[t.to]) { ctx.lineWidth = Math.max(3, S * 0.07); ctx.beginPath(); ctx.arc(x, y, S * 0.44, 0, 7); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(x, y, S * (t.cap ? 0.2 : 0.14) * (0.9 + 0.1 * pulse), 0, 7); ctx.fill(); }
      ctx.restore();
    }
    if (drag8 && drag8.moved) {
      ctx.save(); ctx.globalAlpha = 0.95;
      drawPiece8(ctx, g, drag8.x, drag8.y, S * 1.15, g.board[drag8.i]);
      ctx.restore();
    }
  }

  // tap a piece, then a square; or drag the piece there
  function square8At(clientX, clientY) {
    const b = cv.getBoundingClientRect(), S = sq8();
    const c = Math.floor((clientX - b.left - offX) / S), r = Math.floor((clientY - b.top - offY) / S);
    return c >= 0 && c < 8 && r >= 0 && r < 8 ? view8(r * 8 + c) : -1;
  }
  function try8(to) {
    const t = targets8.find(x => x.to === to);
    if (!t) return false;
    const from = sel8;
    if (t.promo) { showPromo(from, to); return true; }
    act({ t: 'move', from, to });
    return true;
  }
  function down8(e) {
    if ($('overlay').dataset.kind === 'promo') return;
    const i = square8At(e.clientX, e.clientY);
    if (i < 0) return;
    if (sel8 !== null && i !== sel8 && try8(i)) return;
    if (!mine8(i)) { if (sel8 !== null && !(game.chain != null)) { select8(null); } else if (game.winner === null) flash(myTurn() ? "O'z donangizni tanlang" : 'Hozir sizning navbatingiz emas', 1000); return; }
    if (!myTurn()) return flash('Hozir sizning navbatingiz emas', 1200);
    if (game.chain != null && i !== game.chain) return flash('{swords} Urishni shu dona bilan davom ettiring', 1200);
    if (game.kind === 'shashka') {
      const all = Shashka.legalSteps(game, you);
      if (!all.some(s => s.from === i)) {
        haptic('warning');
        return flash(all.length && all[0].over !== undefined ? '{swords} Urish majburiy!' : "Bu dona yura olmaydi", 1300);
      }
    }
    if (sel8 !== i) { select8(i); haptic('light'); Snd.play('tap'); }
    if (!targets8.length && game.kind === 'shaxmat') flash("Bu dona yura olmaydi", 1000);
    const b = cv.getBoundingClientRect();
    drag8 = { i, x0: e.clientX, y0: e.clientY, x: e.clientX - b.left, y: e.clientY - b.top, moved: false, lift: e.pointerType === 'mouse' ? 0 : sq8() * 0.6 };
  }
  addEventListener('pointermove', (e) => {
    if (!drag8) return;
    if (!drag8.moved && Math.hypot(e.clientX - drag8.x0, e.clientY - drag8.y0) < 7) return;
    drag8.moved = true;
    const b = cv.getBoundingClientRect();
    drag8.x = e.clientX - b.left; drag8.y = e.clientY - b.top - drag8.lift;
  });
  addEventListener('pointerup', (e) => {
    if (!drag8) return;
    const d = drag8; drag8 = null;
    if (!d.moved) return; // a tap: the piece stays selected
    const to = square8At(e.clientX, e.clientY - d.lift);
    if (to >= 0 && to !== d.i && targets8.some(t => t.to === to)) { dropped8 = true; try8(to); }
  });
  addEventListener('pointercancel', () => { drag8 = null; });

  function showPromo(from, to) {
    const p = openPanel('promo');
    addText(p, 'h1', 'Piyodani almashtirish');
    addText(p, 'p', "Piyoda oxirgi qatorga yetdi. Qaysi donaga aylansin?");
    const row = document.createElement('div'); row.className = 'promo';
    const white = Chess.colorOf(game, you) === 'w';
    [['q', 'Farzin'], ['r', 'Ruh'], ['b', 'Fil'], ['n', 'Ot']].forEach(([t, name]) => {
      const b = document.createElement('button'), c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1;
      c.width = 54 * dpr; c.height = 54 * dpr;
      const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawChessPiece(x, 27, 27, 48, white ? t.toUpperCase() : t, COLORS[you]);
      b.append(c, name);
      b.onclick = () => { hideOverlay(); act({ t: 'move', from, to, promo: t }); };
      row.appendChild(b);
    });
    p.append(row, bigBtn('Bekor qilish', () => { hideOverlay(); select8(null); }));
  }

  // hub thumbnails: a corner of the board with a piece hopping across
  function drawBoard8Thumb(c, id, now) {
    const n = 4, cs = 92 / n, chess = id === 'shaxmat';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
      c.fillStyle = (r + k) % 2 ? (chess ? '#27305e' : '#232a52') : (chess ? '#8f9bd0' : '#3b4474');
      c.fillRect(k * cs, r * cs, cs, cs);
    }
    const t = (now % 3200) / 3200, hop = Math.sin(Math.min(1, t * 2) * Math.PI) * cs * 0.5, e = Math.min(1, t * 2);
    const g = { kind: id, starter: 0 };
    if (chess) {
      drawChessPiece(c, cs * 0.5, cs * 3.45, cs * 0.9, 'R', COLORS[0]);
      drawChessPiece(c, cs * 3.5, cs * 0.45, cs * 0.9, 'q', COLORS[1]);
      drawChessPiece(c, cs * 2.5, cs * 2.45, cs * 0.9, 'k', COLORS[1]);
      // the knight jumps b1 -> c3 and back
      const fx = t < 0.5 ? lerp(1.5, 2.5, e) : 2.5 - (t - 0.5) * 2, fy = t < 0.5 ? lerp(3.5, 1.5, e) : 1.5 + (t - 0.5) * 4;
      drawChessPiece(c, cs * Math.min(2.5, fx), cs * Math.min(3.5, fy) - (t < 0.5 ? hop : 0) - cs * 0.05, cs * 0.9, 'N', COLORS[0]);
    } else {
      drawPiece8(c, g, cs * 0.5, cs * 3.5, cs, 'w');
      drawPiece8(c, g, cs * 0.5, cs * 0.5, cs, 'B');
      // a man jumps over a black piece: b2 x c3 -> d4
      const cap = t < 0.5 || t > 0.95;
      if (cap) drawPiece8(c, g, cs * 2.5, cs * 1.5, cs, 'b');
      const px = lerp(1.5, 3.5, e), py = lerp(2.5, 0.5, e);
      if (t < 0.95) drawPiece8(c, g, cs * px, cs * py - hop, cs, 'w');
    }
  }

  // ---------- input ----------
  // board position (in cells, view space) -> fence in game coordinates, centred on the nearest intersection
  function fenceAt(o, fx, fy) {
    const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
    const view = o === 'h'
      ? { o: 'h', r: clamp(Math.round(fy), 1, ROWS - 1), c: clamp(Math.round(fx) - 1, 0, COLS - 2) }
      : { o: 'v', c: clamp(Math.round(fx), 1, COLS - 1), r: clamp(Math.round(fy) - 1, 0, ROWS - 2) };
    return fenceView(view); // fenceView is its own inverse
  }

  cv.addEventListener('pointerdown', (e) => {
    if (!game) return;
    const b = cv.getBoundingClientRect();
    const fx = (e.clientX - b.left - offX) / cell, fy = (e.clientY - b.top - offY) / cell;
    if (is8(game.kind)) return down8(e);
    if (game.kind === 'xo') { // the 3x3 board covers the same area as the 9x9 one
      const col = Math.floor(fx / 3), row = Math.floor(fy / 3);
      if (col < 0 || col > 2 || row < 0 || row > 2) return;
      const i = row * 3 + col;
      if (game.board[i] !== null) return flash('Bu katak band', 900);
      return act({ t: 'move', i });
    }
    if (!tool) {
      const g = cellView(Math.floor(fy), Math.floor(fx)); // cellView is its own inverse
      if (F.validMoves(game, you).some(m => m.r === g.r && m.c === g.c)) act({ t: 'move', r: g.r, c: g.c });
      return;
    }
    if (!myTurn()) return flash('Hozir sizning navbatingiz emas', 1200);
    const g = fenceAt(tool, fx, fy);
    if (ghost && ghost.ok && ghost.o === g.o && ghost.r === g.r && ghost.c === g.c) {
      return act({ t: 'fence', o: g.o, r: g.r, c: g.c }); // second tap on the same spot confirms
    }
    const err = F.fenceError(game, g.o, g.r, g.c);
    ghost = { ...g, ok: !err };
    flash(err || 'Tasdiqlash uchun yana bir marta bosing', 1500);
    haptic('light');
  });

  // keep the loop alive even if one frame fails to draw
  function loop(now) { try { draw(now); drawHubThumbs(now); drawProfileHero(now); drawVsHeroes(now); } catch (e) { console.error(e); } requestAnimationFrame(loop); }
  resize(); requestAnimationFrame(loop);

  // join a room straight from an invite (Telegram startapp param or ?room=)
  const startRoom = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('room');
  if (startRoom) { roomId = null; roomCode = null; joinCode = startRoom.toUpperCase().replace(/[^A-Z0-9]/g, ''); connect(); } else showHub();
})();
</script>
